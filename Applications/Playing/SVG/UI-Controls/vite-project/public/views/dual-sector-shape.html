<h2>Dual Sector Shape Feature</h2>
<div class="demo-grid">
  <div class="demo-card">
    <h3>Default Arc</h3>
    <dual-sector-shape radius-min="50" radius-max="110" start-angle="15" end-angle="280" opening-start-angle="0" segments="120"></dual-sector-shape>
  </div>

  <div class="demo-card">
    <h3>Clockwise Orientation</h3>
    <dual-sector-shape radius-min="50" radius-max="110" start-angle="15" end-angle="280" opening-start-angle="0" segments="120" clockwise></dual-sector-shape>
  </div>

  <div class="demo-card">
    <h3>Opening Rotated</h3>
    <dual-sector-shape radius-min="50" radius-max="110" start-angle="0" end-angle="260" opening-start-angle="90" segments="120"></dual-sector-shape>
  </div>

  <div class="demo-card">
    <h3>Narrow Ring</h3>
    <dual-sector-shape radius-min="80" radius-max="110" start-angle="0" end-angle="300" opening-start-angle="0" segments="120"></dual-sector-shape>
  </div>

  <div class="demo-card">
    <h3>Low Segment Count</h3>
    <dual-sector-shape radius-min="50" radius-max="110" start-angle="20" end-angle="300" opening-start-angle="0" segments="20"></dual-sector-shape>
  </div>

  <div class="demo-card">
    <h3>High Segment Count</h3>
    <dual-sector-shape radius-min="50" radius-max="110" start-angle="20" end-angle="300" opening-start-angle="0" segments="360"></dual-sector-shape>
  </div>

  <div class="demo-card">
    <h3>Custom Stroke</h3>
    <dual-sector-shape radius-min="45" radius-max="95" start-angle="0" end-angle="320" opening-start-angle="0" stroke-width="3" stroke="#38bdf8" fill="#0ea5e9"></dual-sector-shape>
  </div>

  <div class="demo-card">
    <h3>Inverted Radii Input</h3>
    <p>Component normalizes min/max order.</p>
    <dual-sector-shape radius-min="120" radius-max="60" start-angle="25" end-angle="300" opening-start-angle="0" segments="120"></dual-sector-shape>
  </div>
</div>
