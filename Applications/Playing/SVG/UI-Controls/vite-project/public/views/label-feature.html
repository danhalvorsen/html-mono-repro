<h2>Label Feature</h2>
<div class="demo-grid">
  <div class="demo-card">
    <h3>Label + Property View</h3>
    <div class="stack">
      <label-feature
        title="Counter"
        value="42"
        state="info"
      ></label-feature>
      <property-panel
        title="Label Properties"
        shape-name="label-feature"
        entries-json='[
          {"name":"title","value":"Counter"},
          {"name":"value","value":"42"},
          {"name":"state","value":"info"},
          {"name":"scale","value":1},
          {"name":"show-title","value":true}
        ]'
      ></property-panel>
    </div>
  </div>

  <div class="demo-card">
    <h3>Default</h3>
    <label-feature title="Default" value="Ready" state="default"></label-feature>
  </div>

  <div class="demo-card">
    <h3>Active</h3>
    <label-feature title="Active" value="Focused" state="active"></label-feature>
  </div>

  <div class="demo-card">
    <h3>Neon Variant</h3>
    <label-feature
      title="Neon"
      value="Signal"
      state="active"
      variant="neon"
      theme="studio"
      shape="pill"
    ></label-feature>
  </div>

  <div class="demo-card">
    <h3>Error</h3>
    <label-feature title="Error" value="Invalid" state="error"></label-feature>
  </div>

  <div class="demo-card">
    <h3>Warning</h3>
    <label-feature title="Warning" value="Check" state="warning"></label-feature>
  </div>

  <div class="demo-card">
    <h3>Info</h3>
    <label-feature title="Info" value="Details" state="info"></label-feature>
  </div>

  <div class="demo-card">
    <h3>Minimal Light Square</h3>
    <label-feature
      title="Minimal"
      value="Label"
      state="default"
      variant="minimal"
      theme="light"
      shape="square"
    ></label-feature>
  </div>

  <div class="demo-card">
    <h3>Success</h3>
    <label-feature title="Success" value="Valid" state="success"></label-feature>
  </div>

  <div class="demo-card">
    <h3>Disabled</h3>
    <label-feature title="Disabled" value="Unavailable" state="disabled"></label-feature>
  </div>

  <div class="demo-card">
    <h3>Large Scale + Info</h3>
    <label-feature title="Scale 1.35" value="Large" scale="1.35" state="info"></label-feature>
  </div>
</div>
