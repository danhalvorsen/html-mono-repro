<h2>Rectangle Shape Feature</h2>
<div class="demo-grid">
  <div class="demo-card">
    <h3>Default Rectangle</h3>
    <rectangle-shape></rectangle-shape>
  </div>

  <div class="demo-card">
    <h3>Compact Rectangle</h3>
    <rectangle-shape width="96" height="56"></rectangle-shape>
  </div>

  <div class="demo-card">
    <h3>Wide Rectangle</h3>
    <rectangle-shape width="220" height="72"></rectangle-shape>
  </div>

  <div class="demo-card">
    <h3>Sharp Corners</h3>
    <rectangle-shape width="160" height="80" rx="0" ry="0"></rectangle-shape>
  </div>

  <div class="demo-card">
    <h3>Rounded Corners</h3>
    <rectangle-shape width="160" height="80" rx="28" ry="28"></rectangle-shape>
  </div>

  <div class="demo-card">
    <h3>Custom Fill</h3>
    <rectangle-shape width="160" height="80" fill="#38bdf8"></rectangle-shape>
  </div>

  <div class="demo-card">
    <h3>Custom Stroke</h3>
    <rectangle-shape width="160" height="80" stroke="#22d3ee" stroke-width="3"></rectangle-shape>
  </div>

  <div class="demo-card">
    <h3>Tall Rectangle</h3>
    <rectangle-shape width="92" height="160" rx="12" ry="12"></rectangle-shape>
  </div>
</div>
