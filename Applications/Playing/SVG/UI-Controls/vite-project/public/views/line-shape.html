<h2>Line Shape Feature</h2>
<div class="demo-grid">
  <div class="demo-card">
    <h3>Default Line</h3>
    <line-shape></line-shape>
  </div>

  <div class="demo-card">
    <h3>Thin Line</h3>
    <line-shape stroke-width="1"></line-shape>
  </div>

  <div class="demo-card">
    <h3>Thick Line</h3>
    <line-shape stroke-width="6"></line-shape>
  </div>

  <div class="demo-card">
    <h3>Square Cap</h3>
    <line-shape line-cap="square" stroke-width="4"></line-shape>
  </div>

  <div class="demo-card">
    <h3>Butt Cap</h3>
    <line-shape line-cap="butt" stroke-width="4"></line-shape>
  </div>

  <div class="demo-card">
    <h3>Dashed Line</h3>
    <line-shape dash-array="8 6" stroke-width="3"></line-shape>
  </div>

  <div class="demo-card">
    <h3>Diagonal</h3>
    <line-shape width="220" height="120" x1="20" y1="20" x2="200" y2="100" stroke-width="3"></line-shape>
  </div>

  <div class="demo-card">
    <h3>Custom Stroke Color</h3>
    <line-shape stroke="#22d3ee" stroke-width="4"></line-shape>
  </div>
</div>
