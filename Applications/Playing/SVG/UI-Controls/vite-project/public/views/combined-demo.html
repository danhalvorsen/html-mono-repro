<h2>Combined Demo Feature</h2>
<div class="demo-grid">
  <div class="demo-card">
    <h3>Label + Dual Sector</h3>
    <div class="stack">
      <label-feature show-title="false" value="Combined"></label-feature>
      <dual-sector-shape radius-min="45" radius-max="95" start-angle="0" end-angle="330" opening-start-angle="0" segments="120"></dual-sector-shape>
    </div>
  </div>

  <div class="demo-card">
    <h3>Circle + Dual Sector</h3>
    <div class="stack">
      <circle-shape radius="52"></circle-shape>
      <dual-sector-shape radius-min="35" radius-max="78" start-angle="20" end-angle="320" opening-start-angle="45" segments="120"></dual-sector-shape>
    </div>
  </div>

  <div class="demo-card">
    <h3>Circle Labels + Path Distribution</h3>
    <div class="stack">
      <circle-label-distribution item-count="6" label-orientation="tangent" label-scale="0.9"></circle-label-distribution>
      <distrbuted-distribution
        points="0,0 120,0 170,70 80,160 -10,120"
        shape-count="8"
        rotation-mode="path"
        source-type="dual-sector-shape"
        object-size="14"
      ></distrbuted-distribution>
    </div>
  </div>
</div>
