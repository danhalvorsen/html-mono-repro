<h2>Knob Shape Feature</h2>
<div class="demo-grid">
  <div class="demo-card">
    <h3>Default Flat Knob</h3>
    <knob-shape></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Value 0.0</h3>
    <knob-shape value="0"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Value 0.5</h3>
    <knob-shape value="0.5"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Value 1.0</h3>
    <knob-shape value="1"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Narrow Sweep</h3>
    <knob-shape min-angle="-100" max-angle="100" value="0.75"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Wide Sweep</h3>
    <knob-shape min-angle="-170" max-angle="170" value="0.35"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Indicator Width</h3>
    <knob-shape indicator-width="2" indicator-offset-ratio="0.35" indicator-length-ratio="0.5"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Indicator Color</h3>
    <knob-shape face-fill="#111827" face-stroke="#374151" indicator-color="#f97316" indicator-width="4" face-stroke-width="2"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Large Knob</h3>
    <knob-shape size="210" value="0.62"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Neon Variant</h3>
    <knob-shape variant="neon" theme="studio"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Retro Rack Variant</h3>
    <knob-shape variant="rack" theme="eurorack" shape="linear"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Short Indicator</h3>
    <knob-shape indicator-offset-ratio="0.52" indicator-length-ratio="0.22" indicator-width="5"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Long Indicator</h3>
    <knob-shape indicator-offset-ratio="0.06" indicator-length-ratio="0.9" indicator-width="3"></knob-shape>
  </div>

  <div class="demo-card">
    <h3>Square + Opacity</h3>
    <knob-shape indicator-linecap="square" indicator-opacity="0.62" indicator-width="6"></knob-shape>
  </div>
</div>
