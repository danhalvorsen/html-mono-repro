<h2>Triangle Shape Feature (Equilateral)</h2>
<div class="demo-grid">
  <div class="demo-card">
    <h3>Default (60°/60°/60°)</h3>
    <triangle-shape></triangle-shape>
  </div>

  <div class="demo-card">
    <h3>Small Side</h3>
    <triangle-shape side="90"></triangle-shape>
  </div>

  <div class="demo-card">
    <h3>Large Side</h3>
    <triangle-shape side="220"></triangle-shape>
  </div>

  <div class="demo-card">
    <h3>Thick Stroke</h3>
    <triangle-shape side="160" stroke-width="5"></triangle-shape>
  </div>

  <div class="demo-card">
    <h3>Custom Fill</h3>
    <triangle-shape side="160" fill="#38bdf8"></triangle-shape>
  </div>

  <div class="demo-card">
    <h3>Custom Stroke</h3>
    <triangle-shape side="160" stroke="#22d3ee" stroke-width="3"></triangle-shape>
  </div>
</div>
