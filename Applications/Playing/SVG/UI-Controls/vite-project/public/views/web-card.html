<h2>Web Card Feature</h2>
<div class="demo-grid">
  <div class="demo-card">
    <h3>Card With Circle Feature</h3>
    <web-card
      header-title="Circle Feature"
      footer-text="Footer token: default"
      variant="flat"
      theme="dark"
      shape="round"
    >
      <circle-shape radius="56"></circle-shape>
    </web-card>
  </div>

  <div class="demo-card">
    <h3>Card With Label Feature</h3>
    <web-card
      header-title="Status Label"
      footer-text="Footer token: info"
      variant="neon"
      theme="studio"
      shape="pill"
    >
      <label-feature
        show-title="false"
        value="ACTIVE"
        state="info"
        variant="neon"
        theme="studio"
        shape="pill"
      ></label-feature>
    </web-card>
  </div>

  <div class="demo-card">
    <h3>Slot Header and Footer</h3>
    <web-card variant="rack" theme="eurorack" shape="key">
      <span slot="header">Knob Control</span>
      <knob-shape
        value="0.62"
        indicator-color="#f97316"
        indicator-length-ratio="0.72"
        indicator-width="4"
        variant="rack"
        theme="eurorack"
        shape="linear"
      ></knob-shape>
      <span slot="footer">Footer token: custom slot text</span>
    </web-card>
  </div>

  <div class="demo-card">
    <h3>Minimal Light Square</h3>
    <web-card
      header-title="Minimal"
      footer-text="variant=minimal, theme=light, shape=square"
      variant="minimal"
      theme="light"
      shape="square"
    >
      <label-feature
        show-title="false"
        value="LIGHT"
        state="default"
        variant="minimal"
        theme="light"
        shape="square"
      ></label-feature>
    </web-card>
  </div>
</div>
