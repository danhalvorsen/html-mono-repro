<h2>Circle Shape Feature</h2>
<div class="demo-grid">
  <div class="demo-card">
    <h3>Default Circle</h3>
    <circle-shape></circle-shape>
  </div>

  <div class="demo-card">
    <h3>Small Radius</h3>
    <circle-shape radius="28"></circle-shape>
  </div>

  <div class="demo-card">
    <h3>Large Radius</h3>
    <circle-shape radius="96"></circle-shape>
  </div>

  <div class="demo-card">
    <h3>Thick Stroke</h3>
    <circle-shape radius="62" stroke-width="6"></circle-shape>
  </div>

  <div class="demo-card">
    <h3>Custom Fill</h3>
    <circle-shape radius="62" fill="#38bdf8"></circle-shape>
  </div>

  <div class="demo-card">
    <h3>Custom Stroke</h3>
    <circle-shape radius="62" stroke="#22d3ee" stroke-width="3"></circle-shape>
  </div>
</div>
