<h2>Triangle Indicator Knob Feature</h2>
<div class="demo-grid">
  <div class="demo-card">
    <h3>Default</h3>
    <triangle-indicator-knob></triangle-indicator-knob>
  </div>

  <div class="demo-card">
    <h3>Value 0.0</h3>
    <triangle-indicator-knob value="0"></triangle-indicator-knob>
  </div>

  <div class="demo-card">
    <h3>Value 0.5</h3>
    <triangle-indicator-knob value="0.5"></triangle-indicator-knob>
  </div>

  <div class="demo-card">
    <h3>Value 1.0</h3>
    <triangle-indicator-knob value="1"></triangle-indicator-knob>
  </div>

  <div class="demo-card">
    <h3>Small Triangle</h3>
    <triangle-indicator-knob indicator-side="14"></triangle-indicator-knob>
  </div>

  <div class="demo-card">
    <h3>Large Triangle</h3>
    <triangle-indicator-knob indicator-side="34"></triangle-indicator-knob>
  </div>

  <div class="demo-card">
    <h3>Inner Indicator</h3>
    <triangle-indicator-knob indicator-distance-ratio="0.55" indicator-side="26"></triangle-indicator-knob>
  </div>

  <div class="demo-card">
    <h3>Custom Indicator Color</h3>
    <triangle-indicator-knob indicator-fill="#22d3ee" indicator-stroke="#155e75"></triangle-indicator-knob>
  </div>

  <div class="demo-card">
    <h3>Narrow Sweep</h3>
    <triangle-indicator-knob min-angle="-90" max-angle="90" value="0.7"></triangle-indicator-knob>
  </div>
</div>
