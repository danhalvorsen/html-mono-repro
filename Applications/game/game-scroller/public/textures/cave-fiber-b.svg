<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="flow" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.045" numOctaves="5" seed="19" result="n"/>
      <feDisplacementMap in="n" in2="n" scale="60" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feColorMatrix in="d" type="matrix"
        values="1.6 0 0 0 -0.45
                0 1.2 0 0 -0.34
                0 0 0.95 0 -0.27
                0 0 0 1 0"/>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#5a3d2f"/>
  <rect width="256" height="256" filter="url(#flow)" opacity="0.9"/>
</svg>
