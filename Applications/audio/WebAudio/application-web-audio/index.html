<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Web Audio Builder + Factory Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }

      .panel {
        background: #1e1e1e;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        text-align: center;
      }

      button {
        font-size: 1rem;
        padding: 0.6rem 1.2rem;
        margin: 0.5rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .start { background: #3aa675; color: white; }
      .stop  { background: #c94b4b; color: white; }

      mr-canvas {
        width: 600px;
        height: 300px;
      }
    </style>
  </head>

  <body>
    <div class="panel">
      <h2>Web Audio Synth Demo</h2>
      <button id="start" class="start">Start Synth</button>
      <button id="stop" class="stop">Stop Synth</button>
    </div>

    <mr-canvas>
      <mr-draggable>
        <mr-rect x="40" y="40" width="120" height="80" fill="red"></mr-rect>
      </mr-draggable>

      <mr-draggable>
        <mr-rect x="220" y="120" width="140" height="90" fill="steelblue"></mr-rect>
      </mr-draggable>
    </mr-canvas>

    <script type="module" src="/src/index.ts"></script>
    <script type="module" src="/src/lit3/WebComponents/MrCanvas.ts"></script>
    <script type="module" src="/src/lit3/WebComponents/MrDraggable.ts"></script>
    <script type="module" src="/src/lit3/WebComponents/MrRect.ts"></script>
  </body>
</html>
