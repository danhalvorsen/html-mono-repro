<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Web Audio Builder + Factory Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    mr-canvas {
      width: 600px;
      height: 300px;
    }
  </style>
</head>

<body>
  <mr-synth-controls></mr-synth-controls>
  <mr-canvas style="width: 800px; height: 400px;">
    <mr-draggable>
      <mr-vex-multi-line-shape stroke="#60a5fa" stroke-width="3">
        <mr-vex-circle-shape vertex-id="A" center='{"x":80,"y":320}' radius="10" draggable="false">
        </mr-vex-circle-shape>

        <mr-vex-circle-shape vertex-id="D" center='{"x":180,"y":80}' radius="10">
        </mr-vex-circle-shape>

        <mr-vex-circle-shape vertex-id="S" center='{"x":360,"y":180}' radius="10">
        </mr-vex-circle-shape>

        <mr-vex-circle-shape vertex-id="R" center='{"x":620,"y":180}' radius="10" draggable="false">
        </mr-vex-circle-shape>
      </mr-vex-multi-line-shape>
    </mr-draggable>
  </mr-canvas>'
  <mr-canvas>
    <mr-draggable>
      <mr-vex-multi-line-shape stroke="#60a5fa" stroke-width="3">
        <mr-vex-circle-shape vertex-id="A" center='{"x":80,"y":320}' radius="10"
          draggable="false"></mr-vex-circle-shape>
        <mr-vex-circle-shape vertex-id="D" center='{"x":180,"y":80}' radius="10"></mr-vex-circle-shape>
        <mr-vex-circle-shape vertex-id="S1" center='{"x":300,"y":180}' radius="10"></mr-vex-circle-shape>
        <mr-vex-circle-shape vertex-id="S2" center='{"x":360,"y":180}' radius="10"></mr-vex-circle-shape>
        <mr-vex-circle-shape vertex-id="R" center='{"x":620,"y":320}' radius="10"
          draggable="false"></mr-vex-circle-shape>
      </mr-vex-multi-line-shape>
     
    </mr-draggable>
    <mr-draggable>
<mr-vex-arrow-shape stroke="#60a5fa" fill="#60a5fa" stroke-width="2">
        <mr-vex-circle-shape slot="start" center='{"x":100,"y":120}' radius="10" visible="true"></mr-vex-circle-shape>
        <mr-vex-circle-shape slot="end" center='{"x":240,"y":120}' radius="10"  visible="true"></mr-vex-circle-shape>
      </mr-vex-arrow-shape>
    </mr-draggable>
     
  </mr-canvas>

  <script type="module" src="./src/index.ts"></script>

</html>
