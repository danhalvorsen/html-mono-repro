<!-- Applications/audio/WebAudio/application-web-audio/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Web Audio Builder + Factory Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    mr-canvas {
      width: 600px;
      height: 300px;
    }
  </style>
</head>

<body>
  <mr-synth-controls></mr-synth-controls>
  <mr-canvas style="width: 800px; height: 400px;">
    <mr-draggable>
      <mr-line-shape>
        <mr-circle-shape slot="start" center='{"x":80,"y":80}' radius="10" fill="cyan"></mr-circle-shape>
        <mr-circle-shape slot="end" center='{"x":220,"y":160}' radius="50" fill="blue"></mr-circle-shape>
      </mr-line-shape>
    </mr-draggable>

    <mr-draggable>
      <mr-edge-shape>
        <mr-circle-shape slot="start" center='{"x":300,"y":100}' radius="20" fill="lightgreen"></mr-circle-shape>
        <mr-circle-shape slot="end" center='{"x":500,"y":250}' radius="20" fill="lightcoral"></mr-circle-shape>
      </mr-edge-shape>
    </mr-draggable>

    <mr-draggable>
      <mr-circle-shape center='{"x":400,"y":200}' radius="30" fill="pink"></mr-circle-shape>
      <mr-circle-shape center='{"x":700,"y":300}' radius="30" fill="gray"></mr-circle-shape>
    </mr-draggable>

    <mr-draggable>

      <mr-vex-line-shape start='{"x":100,"y":300}' end='{"x":200,"y":350}' startRadius="15" endRadius="25" fill="red"
        stroke="red" strokeWidth="15">

      </mr-vex-line-shape>

    </mr-draggable>
    <mr-draggable>
      <mr-vex-circle-shape center='{"x":600,"y":200}' radius="100"></mr-vex-circle-shape>
    </mr-draggable>

  </mr-canvas>

  <script type="module" src="./src/index.ts"></script>
</body>

</html>
