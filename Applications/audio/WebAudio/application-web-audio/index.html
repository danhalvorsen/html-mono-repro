<!-- Applications/audio/WebAudio/application-web-audio/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Web Audio Builder + Factory Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    mr-canvas {
      width: 600px;
      height: 300px;
    }
  </style>
</head>

<body>
  <mr-synth-controls></mr-synth-controls>
  <mr-canvas style="width: 800px; height: 400px;">

    <mr-draggable>

      <mr-vex-line-shape stroke="#60a5fa" stroke-width="2">

        <mr-vex-circle-shape slot="start" center='{"x":100,"y":200}' radius="12">
        </mr-vex-circle-shape>

        <mr-vex-circle-shape slot="end" center='{"x":200,"y":200}' radius="12">
        </mr-vex-circle-shape>

      </mr-vex-line-shape>

    </mr-draggable>
    <mr-draggable>
      <mr-vex-circle-shape slot="end" center='{"x":200,"y":300}' radius="12">
      </mr-vex-circle-shape>
    </mr-draggable>

    <mr-draggable>
      <mr-vex-polygon-shape stroke="#f87171" stroke-width="2" fill="#f87171" fill-opacity="0.5">

        <mr-vex-circle-shape slot="vertex" center='{"x":300,"y":200}' radius="12">
        </mr-vex-circle-shape>

        <mr-vex-circle-shape slot="vertex" center='{"x":400,"y":200}' radius="12">
        </mr-vex-circle-shape>

        <mr-vex-circle-shape slot="vertex" center='{"x":350,"y":300}' radius="12">
        </mr-vex-circle-shape>

      </mr-vex-polygon-shape>

    </mr-draggable>

  </mr-canvas>
  <mr-canvas>
    <mr-draggable>
      <mr-vex-rect stroke="#60a5fa" stroke-width="2">
        <mr-vex-circle-shape slot="start" center='{"x":100,"y":120}' radius="10" draggable="false"
          visible="fa"></mr-vex-circle-shape>
        <mr-vex-circle-shape slot="end" center='{"x":240,"y":260}' radius="10" draggable="true"></mr-vex-circle-shape>
      </mr-vex-rect>

    </mr-draggable>
  </mr-canvas>

  <script type="module" src="./src/index.ts"></script>
</body>

</html>
