# Prometheus scrape config snippet - include this in your Prometheus config (scrape_configs)
# If using the compose Prometheus, add this file as a config or merge into prometheus.yml
scrape_configs:
  - job_name: 'docker_volume_exporter'
    static_configs:
      - targets: ['volume-exporter:9101']
        labels:
          service: volume-exporter
    metrics_path: /
    scrape_interval: 60s
