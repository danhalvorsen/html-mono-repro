<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>composite-demo</title>

  <!-- Global styles -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./src/index.css" />
</head>
<body>
  <my-element>
    <h1>Vite + Lit</h1>
  </my-element>

  <!-- SVG scene (must be in body so scripts can find it) -->
  <svg id="scene" width="900" height="600" viewBox="0 0 900 600"></svg>

  <!-- App scripts: load modules after DOM so they can query #scene -->
  <script type="module" src="./src/my-element.ts"></script>
  <script type="module" src="./src/index.ts"></script>

  <!-- Demo setup: import and run after modules are available -->
  <script type="module">
    import { setupDemo } from './src/demo-setup.js';
    // Wait for DOM to be ready (defensive)
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => setupDemo('#scene'));
    } else {
      setupDemo('#scene');
    }
  </script>
</body>
</html>
