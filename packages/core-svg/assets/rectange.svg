<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" width="200" height="120" role="img" aria-labelledby="rectTitle rectDesc">
  <title id="rectTitle">Semantic rectangle</title>
  <desc id="rectDesc">A rectangle constructed from named vertices (tl, tr, br, bl) and edges (top, right, bottom, left).</desc>

  <!-- Vertices (handles) - larger radius for interaction -->
  <circle id="v_tl" cx="10"  cy="10"  r="6" fill="#222" stroke="#000" stroke-width="1" />
  <circle id="v_tr" cx="190" cy="10"  r="6" fill="#222" stroke="#000" stroke-width="1" />
  <circle id="v_br" cx="190" cy="110" r="6" fill="#222" stroke="#000" stroke-width="1" />
  <circle id="v_bl" cx="10"  cy="110" r="6" fill="#222" stroke="#000" stroke-width="1" />

  <!-- Edges -->
  <line id="e_top" x1="10" y1="10" x2="190" y2="10" stroke="#000" stroke-width="1" />
  <line id="e_right" x1="190" y1="10" x2="190" y2="110" stroke="#000" stroke-width="1" />
  <line id="e_bottom" x1="190" y1="110" x2="10" y2="110" stroke="#000" stroke-width="1" />
  <line id="e_left" x1="10" y1="110" x2="10" y2="10" stroke="#000" stroke-width="1" />

  <!-- Filled rectangle polygon using the same semantic vertices -->
  <polygon id="s_rectangle" points="10,10 190,10 190,110 10,110" fill="#D8D8D8" stroke="#000" stroke-width="2"/>
</svg>
