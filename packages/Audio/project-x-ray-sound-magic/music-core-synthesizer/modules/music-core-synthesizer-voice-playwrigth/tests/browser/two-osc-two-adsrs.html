<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Two Oscillators Two ADSRs</title>
  </head>
  <body>
    <main>
      <button id="play-voice" type="button">Play Two ADSR Voice</button>

      <output id="voice-state" aria-live="polite">idle</output>
      <output id="voice-layer-count" aria-live="polite">0</output>
      <output id="voice-oscillator-count" aria-live="polite">0</output>
      <output id="voice-envelope-count" aria-live="polite">0</output>
      <output id="voice-frequencies" aria-live="polite"></output>
      <output id="voice-envelope-releases" aria-live="polite"></output>
      <output id="voice-elapsed-ms" aria-live="polite">0</output>
      <output id="voice-error" aria-live="polite"></output>
    </main>

    <script type="module" src="./two-osc-two-adsrs-harness.ts"></script>
  </body>
</html>
